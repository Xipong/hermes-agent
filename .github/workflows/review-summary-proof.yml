name: Review summary regression proof
on:
  push:
    branches: [ops/review-summary-proof]
permissions:
  contents: write
concurrency:
  group: review-summary-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean base
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          text = pathlib.Path('.github/review-summary-patch.b64').read_text()
          for old, new in [('AGMdJJFF', 'AGMdJFF'), ('SeJJ4DR', 'SeJ4DR'), ('l7NSZZOr', 'l7NSZOr')]:
              text = text.replace(old, new)
          data = zlib.decompress(base64.b64decode(text))
          assert hashlib.sha256(data).hexdigest() == '90135149b288b4b9c972746da5aeb419df8c9d17a1f025d7ce9015c94d652f5e'
          pathlib.Path('/tmp/build_review_pr.py').write_bytes(data)
          PY
          cp .github/review-summary-driver.py /tmp/driver.py
          cp .github/refine-review-patch.py /tmp/refine_review_patch.py
          git fetch origin e440bf35472c30c2ee5527e884a866c12ad15b91 --depth=1
          git checkout -b fix/desktop-durable-review-summary e440bf35472c30c2ee5527e884a866c12ad15b91
          python /tmp/driver.py
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install test dependencies
        run: |
          uv sync --locked --python 3.11 --extra dev --extra anthropic
          npm --version | grep -q '^12\.' || npm install -g npm@12
          npm ci
      - name: Prove regressions on base
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          set +e
          source .venv/bin/activate
          scripts/run_tests.sh tests/agent/test_review_summary_durability.py > /tmp/review-base-python.log 2>&1
          py=$?
          (cd apps/desktop && npx vitest run --project ui src/app/session/hooks/use-message-stream/review-summary-durability.test.tsx) > /tmp/review-base-ui.log 2>&1
          js=$?
          cat /tmp/review-base-python.log /tmp/review-base-ui.log
          test "$py" -ne 0 && test "$js" -ne 0
      - name: Apply production fix
        run: |
          python /tmp/driver.py --apply
          python -m compileall -q agent/review_summary.py agent/background_review.py agent/turn_context.py hermes_state_messages.py tui_gateway/server.py
          git status --short
      - name: Backend regressions
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/agent/test_review_summary_durability.py tests/tui_gateway/test_review_summary_callback.py tests/run_agent/test_background_review.py
      - name: Desktop regressions and formatting
        working-directory: apps/desktop
        run: |
          files='src/lib/chat-messages/review-summary.ts src/lib/chat-messages/hydration.ts src/lib/chat-messages/reconciliation.ts src/app/session/hooks/use-message-stream/gateway-event/status.ts src/components/assistant-ui/thread/system-message.tsx src/app/session/hooks/use-message-stream/review-summary-durability.test.tsx src/app/contrib/wiring.tsx src/app/contrib/hooks/use-background-sync.ts'
          npx prettier --write $files
          npx vitest run --project ui src/app/session/hooks/use-message-stream/review-summary-durability.test.tsx src/app/session/hooks/use-message-stream/timeline-events.test.tsx src/lib/chat-messages.test.ts src/app/contrib/hooks/use-background-sync.test.ts
          npx tsc -p . --noEmit
          npx eslint $files
      - name: Publish tested feature branch
        run: |
          git diff --check
          git config user.name Xipong
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git add agent/review_summary.py agent/background_review.py agent/turn_context.py hermes_state_messages.py tui_gateway/server.py tests/agent/test_review_summary_durability.py apps/desktop/src/lib/chat-messages/review-summary.ts apps/desktop/src/lib/chat-messages/hydration.ts apps/desktop/src/lib/chat-messages/reconciliation.ts apps/desktop/src/app/session/hooks/use-message-stream/gateway-event/status.ts apps/desktop/src/components/assistant-ui/thread/system-message.tsx apps/desktop/src/app/session/hooks/use-message-stream/review-summary-durability.test.tsx apps/desktop/src/app/contrib/wiring.tsx apps/desktop/src/app/contrib/hooks/use-background-sync.ts
          git commit -m 'fix(desktop): persist self-improvement receipts across transcript hydration'
          git push origin HEAD:refs/heads/fix/desktop-durable-review-summary
          git show --stat --oneline HEAD
