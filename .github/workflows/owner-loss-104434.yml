name: Fix stale owner-loss latch in PR 104434
on:
  push:
    branches: [automation/port-76230-over-104299]
    paths:
      - .github/workflows/owner-loss-104434.yml
      - scripts/owner_loss_104434/apply.py
permissions:
  contents: write
concurrency:
  group: owner-loss-104434
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
      - name: Build owner-loss fix on the exact PR head
        run: |
          set -euo pipefail
          mkdir -p /tmp/owner-loss-104434
          cp scripts/owner_loss_104434/apply.py /tmp/owner-loss-104434/apply.py
          git fetch --depth=1 origin acd3be4810b1f905087fa9d8cf1d97f83e9a35f4
          git switch --detach acd3be4810b1f905087fa9d8cf1d97f83e9a35f4
          python /tmp/owner-loss-104434/apply.py "$PWD"
          git add \
            agent/delegation_inject.py \
            tools/async_delegation.py \
            tests/agent/test_delegation_delivery.py
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github scripts)"
          git diff --cached --stat | tee /tmp/owner-loss-104434/diff-stat.txt
          git diff --cached --binary > /tmp/owner-loss-104434/validated.patch
          python -m py_compile \
            agent/delegation_inject.py \
            tools/async_delegation.py \
            tests/agent/test_delegation_delivery.py
      - name: Install locked test environment
        run: uv sync --locked --python 3.11 --extra dev --extra messaging --extra anthropic
      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/delegation_inject.py \
            tools/async_delegation.py \
            tests/agent/test_delegation_delivery.py
      - name: Validate delivery, ownership, recovery, gateway and TUI regressions
        run: |
          set -o pipefail
          HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh -j 2 --file-timeout 300 \
            tests/agent/test_delegation_delivery.py \
            tests/tools/test_async_delegation.py \
            tests/tools/test_process_registry.py \
            tests/tools/test_restored_delegation_ownership.py \
            tests/cli/test_cli_async_delegation_delivery.py \
            tests/gateway/test_completion_delivery.py \
            tests/tui_gateway/test_delegation_session_lifecycle.py \
            tests/test_tui_gateway_server.py \
            --tb=short 2>&1 | tee /tmp/owner-loss-104434/tests.txt
      - name: Repeat owner-loss and cross-turn latch regressions
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            uv run pytest -q \
              tests/agent/test_delegation_delivery.py::test_owner_loss_retires_local_latch_and_next_turn_can_inject \
              tests/agent/test_delegation_delivery.py::test_failed_ack_after_owner_loss_prunes_stale_local_entry \
              tests/agent/test_delegation_delivery.py::test_uncertain_previous_turn_claim_does_not_block_current_turn \
              --tb=short
          done | tee /tmp/owner-loss-104434/repeat.txt
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        name: Fresh publication checkout isolated from test subprocesses
        with:
          repository: Xipong/hermes-agent
          ref: feat/subagent-inject-over-104299-validated
          path: publish
          fetch-depth: 1
      - name: Publish with exact-head lease
        working-directory: publish
        run: |
          set -euo pipefail
          branch=feat/subagent-inject-over-104299-validated
          expected=acd3be4810b1f905087fa9d8cf1d97f83e9a35f4
          test "$(git rev-parse HEAD)" = "$expected"
          git apply /tmp/owner-loss-104434/validated.patch
          git add \
            agent/delegation_inject.py \
            tools/async_delegation.py \
            tests/agent/test_delegation_delivery.py
          git diff --cached --binary > /tmp/owner-loss-104434/publication.patch
          cmp /tmp/owner-loss-104434/validated.patch \
              /tmp/owner-loss-104434/publication.patch
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git commit \
            -m 'fix(delegation): retire stale inject claims after owner loss' \
            -m 'Scope the in-memory single-flight latch to its originating turn. Failed renewals mark local ownership abandoned; failed ack/release paths query the exact durable token and prune only when ownership definitively moved or the row became terminal. Preserve uncertain claims for retry and never requeue a row owned by another consumer. Add regressions for lease takeover, heartbeat shutdown, committed-carrier acknowledgement loss, old-turn finalization, and a subsequent successful inject on the same cached parent.'
          test "$(git rev-parse HEAD^)" = "$expected"
          git push "--force-with-lease=refs/heads/$branch:$expected" \
            origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee /tmp/owner-loss-104434/published-sha.txt
          git show -s --format=fuller HEAD \
            > /tmp/owner-loss-104434/published-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: owner-loss-104434-validation
          path: /tmp/owner-loss-104434/
          retention-days: 3
