name: Quota log follow-up workbench
on:
  push:
    branches: [work/quota-log-followup-108661]
    paths: [.github/workflows/quota-log-followup.yml, '.github/quota_followup*.py']
permissions:
  contents: write
concurrency:
  group: quota-log-followup-108661
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install repository test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q 'uv==0.8.22'
          .venv/bin/uv pip install --python .venv/bin/python -q -e '.[dev]'
      - name: Reproduce PR gaps, verify fix, publish clean commit
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: .venv/bin/python .github/quota_followup_v2.py
