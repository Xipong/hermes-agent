name: tmp rebase 109474

on:
  push:
    branches:
      - tmp/rebase-runner-109474

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Rebase PR branch onto upstream main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: 5c7ed5bdd7063148dcaf51347bed9a7bb194d2fc
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          git fetch origin fix/review-worker-ownership-cadence
          git checkout -B rebase-work origin/fix/review-worker-ownership-cadence
          git rebase -X theirs upstream/main
          echo "rebased_head=$(git rev-parse HEAD)"
          git diff --stat upstream/main...HEAD
          git push origin HEAD:refs/heads/fix/review-worker-ownership-cadence \
            --force-with-lease=refs/heads/fix/review-worker-ownership-cadence:${EXPECTED_HEAD}
