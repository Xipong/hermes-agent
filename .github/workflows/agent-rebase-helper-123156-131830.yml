name: Agent rebase helper 123156-131830

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/agent-rebase-helper-123156-131830.json

permissions:
  contents: write

jobs:
  rebase-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare or finalize forward-port
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          eval "$(python - <<'PY'
          import json, shlex
          with open('.github/agent-rebase-helper-123156-131830.json', encoding='utf-8') as fh:
              cfg = json.load(fh)
          required = ('action', 'pr_number', 'original_branch', 'expected_head', 'upstream_sha', 'commit_title')
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit(f"missing config keys: {', '.join(missing)}")
          cfg.setdefault('work_branch', f"agent-rebase-work-{cfg['pr_number']}-20261015")
          for key, value in cfg.items():
              print(f"export {key.upper()}={shlex.quote(str(value))}")
          PY
          )"

          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          git fetch --no-tags origin "+refs/heads/${ORIGINAL_BRANCH}:refs/remotes/origin/${ORIGINAL_BRANCH}"

          if [ "$ACTION" = prepare ]; then
            test "$(git rev-parse "origin/${ORIGINAL_BRANCH}")" = "$EXPECTED_HEAD"
            git checkout -B "$WORK_BRANCH" "$UPSTREAM_SHA"

            set +e
            git merge --squash --no-commit "origin/${ORIGINAL_BRANCH}"
            merge_rc=$?
            set -e

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "$merge_rc" -ne 0 ] && [ "${#conflicts[@]}" -eq 0 ]; then
              echo "merge failed without ordinary file conflicts" >&2
              exit "$merge_rc"
            fi

            rm -rf .agent-rebase-stages
            mkdir -p .agent-rebase-stages/base .agent-rebase-stages/ours .agent-rebase-stages/theirs
            printf '%s\n' "${conflicts[@]}" > .agent-rebase-conflicts

            for path in "${conflicts[@]}"; do
              for spec in '1:base' '2:ours' '3:theirs'; do
                stage="${spec%%:*}"
                side="${spec#*:}"
                dest=".agent-rebase-stages/${side}/${path}"
                mkdir -p "$(dirname "$dest")"
                git show ":${stage}:${path}" > "$dest" 2>/dev/null || rm -f "$dest"
              done
              git checkout --conflict=merge -- "$path" 2>/dev/null || true
            done

            python - <<'PY'
          import json, os
          meta = {
              'pr_number': int(os.environ['PR_NUMBER']),
              'original_branch': os.environ['ORIGINAL_BRANCH'],
              'expected_head': os.environ['EXPECTED_HEAD'],
              'upstream_sha': os.environ['UPSTREAM_SHA'],
              'commit_title': os.environ['COMMIT_TITLE'],
              'work_branch': os.environ['WORK_BRANCH'],
          }
          with open('.agent-rebase-meta.json', 'w', encoding='utf-8') as fh:
              json.dump(meta, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          PY

            git add -A
            git commit -m "chore: prepare rebase #${PR_NUMBER}"
            git push --force origin "HEAD:refs/heads/${WORK_BRANCH}"
            echo "Prepared ${WORK_BRANCH}; conflicts=${#conflicts[@]}"
            exit 0
          fi

          if [ "$ACTION" = finalize ]; then
            git fetch --no-tags origin "+refs/heads/${WORK_BRANCH}:refs/remotes/origin/${WORK_BRANCH}"
            git checkout -B "$WORK_BRANCH" "origin/${WORK_BRANCH}"

            if [ -n "${EXPECTED_WORK_HEAD:-}" ]; then
              test "$(git rev-parse HEAD)" = "$EXPECTED_WORK_HEAD"
            fi

            if [ -s .agent-rebase-conflicts ]; then
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- "$path"; then
                  echo "unresolved conflict markers remain in $path" >&2
                  exit 1
                fi
              done < .agent-rebase-conflicts
            fi

            test "$(git rev-parse "origin/${ORIGINAL_BRANCH}")" = "$EXPECTED_HEAD"
            rm -rf .agent-rebase-conflicts .agent-rebase-meta.json .agent-rebase-stages
            git add -A
            git reset --soft "$UPSTREAM_SHA"
            git commit -m "$COMMIT_TITLE"
            git push --force-with-lease="refs/heads/${ORIGINAL_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${ORIGINAL_BRANCH}"
            git push origin --delete "$WORK_BRANCH" || true
            exit 0
          fi

          echo "unknown action: $ACTION" >&2
          exit 2
