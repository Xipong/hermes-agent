name: Agent rebase batch 123156-131830

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-rebase-helper-123156-131830.yml
      - .github/agent-rebase-helper-123156-131830.json
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/agent-rebase-helper-123156-131830.json

permissions:
  contents: write

concurrency:
  group: agent-rebase-batch-123156-131830
  cancel-in-progress: false

jobs:
  rebase-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare or finalize selected branches
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: .github/agent-rebase-helper-123156-131830.json
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$CONFIG" ] || exit 0

          action="$(jq -r '.action' "$CONFIG")"
          upstream_sha="$(jq -r '.upstream_sha' "$CONFIG")"
          count="$(jq '.prs | length' "$CONFIG")"

          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "$upstream_sha"

          for ((i=0; i<count; i++)); do
            pr="$(jq -r ".prs[$i].pr_number" "$CONFIG")"
            branch="$(jq -r ".prs[$i].original_branch" "$CONFIG")"
            expected="$(jq -r ".prs[$i].expected_head" "$CONFIG")"
            title="$(jq -r ".prs[$i].commit_title" "$CONFIG")"
            work="$(jq -r ".prs[$i].work_branch" "$CONFIG")"
            expected_work="$(jq -r ".prs[$i].expected_work_head // empty" "$CONFIG")"

            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            actual="$(git rev-parse "refs/remotes/origin/${branch}")"

            if [ "$action" = prepare ]; then
              if git ls-remote --exit-code --heads origin "$work" >/dev/null 2>&1; then
                echo "PR ${pr}: ${work} already exists; skipping prepare"
                continue
              fi
              test "$actual" = "$expected"

              git checkout -B "$work" "$upstream_sha"
              git reset --hard "$upstream_sha"
              git clean -fdx

              set +e
              git merge --squash --no-commit "refs/remotes/origin/${branch}"
              merge_rc=$?
              set -e

              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "$merge_rc" -ne 0 ] && [ "${#conflicts[@]}" -eq 0 ]; then
                echo "PR ${pr}: merge failed without ordinary file conflicts" >&2
                exit "$merge_rc"
              fi

              rm -rf .agent-rebase-stages
              mkdir -p .agent-rebase-stages/base .agent-rebase-stages/ours .agent-rebase-stages/theirs
              printf '%s\n' "${conflicts[@]}" > .agent-rebase-conflicts

              for path in "${conflicts[@]}"; do
                for spec in '1:base' '2:ours' '3:theirs'; do
                  stage="${spec%%:*}"
                  side="${spec#*:}"
                  dest=".agent-rebase-stages/${side}/${path}"
                  mkdir -p "$(dirname "$dest")"
                  git show ":${stage}:${path}" > "$dest" 2>/dev/null || rm -f "$dest"
                done
                git checkout --conflict=merge -- "$path" 2>/dev/null || true
              done

              jq -n \
                --argjson pr "$pr" \
                --arg original_branch "$branch" \
                --arg expected_head "$expected" \
                --arg upstream_sha "$upstream_sha" \
                --arg commit_title "$title" \
                --arg work_branch "$work" \
                '{pr_number:$pr, original_branch:$original_branch, expected_head:$expected_head, upstream_sha:$upstream_sha, commit_title:$commit_title, work_branch:$work_branch}' \
                > .agent-rebase-meta.json

              git add -A
              git commit -m "chore: prepare rebase #${pr}"
              git push --force origin "HEAD:refs/heads/${work}"
              echo "PR ${pr}: prepared ${work}; conflicts=${#conflicts[@]}"
              continue
            fi

            if [ "$action" = finalize ]; then
              if ! git ls-remote --exit-code --heads origin "$work" >/dev/null 2>&1; then
                if [ "$actual" != "$expected" ]; then
                  echo "PR ${pr}: already finalized; skipping"
                  continue
                fi
                echo "PR ${pr}: missing ${work}" >&2
                exit 1
              fi

              git fetch --no-tags origin "+refs/heads/${work}:refs/remotes/origin/${work}"
              git checkout -B "$work" "refs/remotes/origin/${work}"
              if [ -n "$expected_work" ]; then
                test "$(git rev-parse HEAD)" = "$expected_work"
              fi

              if [ -s .agent-rebase-conflicts ]; then
                while IFS= read -r path; do
                  [ -z "$path" ] && continue
                  if grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- "$path"; then
                    echo "PR ${pr}: unresolved markers in ${path}" >&2
                    exit 1
                  fi
                done < .agent-rebase-conflicts
              fi

              test "$actual" = "$expected"
              rm -rf .agent-rebase-conflicts .agent-rebase-meta.json .agent-rebase-stages
              git add -A
              git reset --soft "$upstream_sha"
              git commit -m "$title"
              git push --force-with-lease="refs/heads/${branch}:${expected}" origin "HEAD:refs/heads/${branch}"
              git push origin --delete "$work" || true
              echo "PR ${pr}: finalized"
              continue
            fi

            echo "Unknown action: ${action}" >&2
            exit 2
          done
