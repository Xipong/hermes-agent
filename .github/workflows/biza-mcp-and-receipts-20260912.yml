name: Biza MCP extraction validation
on:
  push:
    branches: [automation/biza-mcp-and-receipts-20260912]
permissions:
  contents: write
jobs:
  mcp-extraction:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 681af68a5d893cd5a9703b94f5be41cacc784927
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: |
          npm --version | grep -q '^12\.' || npm install -g npm@12
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Reuse the pinned extraction scripts and compatibility tests
        run: |
          git fetch --no-tags --depth=1 origin c61d3e0aee82ad47b3186f8684210688c2d93307
          git show c61d3e0aee82ad47b3186f8684210688c2d93307:.github/workflows/biza-mcp-and-receipts-20260912.yml > /tmp/biza-original.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('/tmp/biza-original.yml').read_text().split('  mcp-extraction:\n', 1)[1]
          names = [
              'Add facade-level request compatibility coverage',
              'Extract MCP methods and wire types without changing their bodies',
              'Move long commented provider examples into their existing guide',
          ]
          for name in names:
              marker = '      - name: ' + name + '\n        run: |\n'
              assert text.count(marker) == 1, name
              block = text.split(marker, 1)[1].split('\n      - ', 1)[0]
              lines = block.splitlines()
              assert all(not line.strip() or line.startswith('          ') for line in lines)
              script = '\n'.join(line[10:] if line.startswith('          ') else '' for line in lines) + '\n'
              print('Executing pinned stage:', name, flush=True)
              subprocess.run(['bash', '-e', '-c', script], check=True)
          p = Path('web/src/lib/api.ts')
          source = p.read_text()
          old = 'import { createMcpApi } from "./api-mcp";'
          assert source.count(old) == 1
          p.write_text(source.replace(old, 'import { createMcpApi, type McpServerCreate } from "./api-mcp";'))
          PY
      - name: Verify the complete web suite and Desktop MCP consumers
        run: |
          npx prettier --write web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts
          npx eslint --fix web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts
          npm run test --workspace web -- --run --reporter=json --outputFile=/tmp/biza-web.json > /tmp/biza-web.log 2>&1 || { tail -100 /tmp/biza-web.log; exit 1; }
          npm run test --workspace apps/desktop -- --project ui src/api/mcp-network.test.ts src/lib/mcp-probe-cache.test.ts --reporter=json --outputFile=/tmp/biza-desktop.json > /tmp/biza-desktop.log 2>&1 || { tail -100 /tmp/biza-desktop.log; exit 1; }
          python3 - <<'PY'
          import json
          for name, minimum in [('web', 310), ('desktop', 14)]:
              result = json.load(open('/tmp/biza-' + name + '.json'))
              assert result['numFailedTests'] == 0 and result['numPassedTests'] >= minimum, result
              print(name, result['numPassedTests'], 'passed;', result['numFailedTests'], 'failed')
          PY
      - name: Typecheck both frontend consumers and inspect final boundaries
        run: |
          npx tsc -p web/tsconfig.app.json --noEmit
          npx tsc -p apps/desktop/tsconfig.json --noEmit
          npx eslint web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          names = ['web/src/lib/api.ts', 'web/src/lib/api-types.ts', 'web/src/lib/api-mcp.ts', 'web/src/lib/api-mcp.test.ts', 'cli-config.yaml.example', 'website/docs/user-guide/configuring-models.md']
          for name in names:
              count = len(Path(name).read_text().splitlines())
              print(name, count, 'lines')
              assert count <= 2000
          original = subprocess.check_output(['git', 'show', 'HEAD:cli-config.yaml.example'], text=True)
          active = lambda text: [line for line in text.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert active(original) == active(Path('cli-config.yaml.example').read_text())
          actual = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(actual) == {'web/src/lib/api.ts', 'cli-config.yaml.example', 'website/docs/user-guide/configuring-models.md'}, actual
          PY
      - name: Publish only the verified product delta
        run: |
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git add web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts cli-config.yaml.example website/docs/user-guide/configuring-models.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(mcp): extract dashboard contracts and preserve configuration guidance' -m "Addresses andrexibiza's extraction-before-growth review. Validated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: facade request parity before/after, full web tests, Desktop MCP suites, both frontend typechecks, focused ESLint, unchanged active config and preserved examples. No change to Python transport or routing policy."
          git push origin "HEAD:refs/heads/automation/biza-107713-${GITHUB_RUN_ID}"
          echo "107713 candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
