name: Biza MCP extraction and review receipts
on:
  push:
    branches: [automation/biza-mcp-and-receipts-20260912]
permissions:
  contents: write
jobs:
  evidence:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 106040
            head: f32938f55ef8948741df387ec39412538b5f3b9b
            project: ui
            test: src/store/activity.test.ts
            source: src/store/activity.ts
            tsconfig: tsconfig.json
          - pr: 106042
            head: 725ac30acb4809a16cad6b33094ba3f528085b2b
            project: ui
            test: src/store/composer-suggestions.test.ts
            source: src/store/composer-suggestions.ts
            tsconfig: tsconfig.json
          - pr: 106049
            head: f32a5ec5cda7f9051e611f6d5d3d888abb9dadbb
            project: electron
            test: electron/update-marker.test.ts
            source: electron/update-marker.ts
            tsconfig: tsconfig.electron.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.head }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: |
          npm --version | grep -q '^12\.' || npm install -g npm@12
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact-head Vitest, lint and typecheck
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.head }}'
          npm run test --workspace apps/desktop -- --project '${{ matrix.project }}' '${{ matrix.test }}' --reporter=verbose
          npx eslint 'apps/desktop/${{ matrix.source }}' 'apps/desktop/${{ matrix.test }}'
          npx tsc -p 'apps/desktop/${{ matrix.tsconfig }}' --noEmit
          git diff --check
          test -z "$(git diff --name-only)"
      - name: Verify draft helper reachability without adding callers
        if: matrix.pr == 106040
        run: git grep -n buildRailTasks -- apps/desktop/src
  release-gate:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6b54647e6097c5debfaf1097ac948bfb7e630aeb
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: |
          npm --version | grep -q '^12\.' || npm install -g npm@12
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin the later-pass publication scenario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/electron/backend-release-gate.test.ts')
          text = p.read_text()
          anchor = "  it('ignores invalid PIDs in the seed and straggler sets'"
          assert text.count(anchor) == 1
          test = '''  it('collects a later-pass straggler before a previously busy gate can pass', async () => {
            const clock = fakeClock()
            let served = false
            let killedAt: number | null = null
            const deps = makeDeps({
              now: clock.now,
              sleep: clock.sleep,
              collectStragglerPids: () => {
                if (served || clock.now() < RELEASE_GATE_POLL_MS) {
                  return []
                }
                served = true
                return [7777]
              },
              killProcessTree: pid => {
                killedAt = clock.now()
                deps.kills.push(pid)
              },
              isPidAlive: pid => {
                if (pid === 4021) {
                  return clock.now() < RELEASE_GATE_POLL_MS
                }
                return pid === 7777 && killedAt !== null && clock.now() < killedAt + 2 * RELEASE_GATE_POLL_MS
              }
            })

            const result = await waitForBackendRelease([4021], deps, 'later-pass')

            expect(deps.kills).toEqual([7777])
            expect(clock.now()).toBe(3 * RELEASE_GATE_POLL_MS)
            expect(result).toEqual({ unlocked: true, lingeringPids: [] })
          })

          '''
          p.write_text(text.replace(anchor, test + anchor))
          PY
      - name: Demonstrate that the old check-before-collect ordering fails
        run: |
          cp apps/desktop/electron/backend-release-gate.ts /tmp/release-fixed.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/electron/backend-release-gate.ts')
          text = p.read_text()
          a = text.index('    // A supervised backend can respawn')
          b = text.index('    const lingering =', a)
          c = text.index('    await deps.sleep(RELEASE_GATE_POLL_MS)', b)
          p.write_text(text[:a] + text[b:c] + text[a:b] + text[c:])
          PY
          set +e
          npm run test --workspace apps/desktop -- --project electron electron/backend-release-gate.test.ts -t later-pass --reporter=json --outputFile=/tmp/release-red.json
          result=$?
          set -e
          cp /tmp/release-fixed.ts apps/desktop/electron/backend-release-gate.ts
          test "$result" -ne 0
          python3 -c "import json; r=json.load(open('/tmp/release-red.json')); assert r['numFailedTests']==1, r"
      - name: Validate and publish the test-only candidate
        run: |
          npx eslint --fix apps/desktop/electron/backend-release-gate.test.ts
          npx prettier --write apps/desktop/electron/backend-release-gate.test.ts
          npx eslint apps/desktop/electron/backend-release-gate.ts apps/desktop/electron/backend-release-gate.test.ts
          npm run test --workspace apps/desktop -- --project electron electron/backend-release-gate.test.ts --reporter=verbose
          npx tsc -p apps/desktop/tsconfig.electron.json --noEmit
          git diff --check
          test "$(git diff --name-only)" = 'apps/desktop/electron/backend-release-gate.test.ts'
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git add apps/desktop/electron/backend-release-gate.test.ts
          git commit -m 'test(desktop): cover later-pass backend straggler publication' -m "Validated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; mutation red, full gate tests, focused lint and Electron typecheck. Deadline semantics unchanged."
          git push origin "HEAD:refs/heads/automation/biza-106051-${GITHUB_RUN_ID}"
          echo "106051 candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  mcp-extraction:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 681af68a5d893cd5a9703b94f5be41cacc784927
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: |
          npm --version | grep -q '^12\.' || npm install -g npm@12
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Add facade-level request compatibility coverage
        run: |
          cat > web/src/lib/api-mcp.test.ts <<'TS'
          // @vitest-environment jsdom
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { api, setManagementProfile, type McpNetwork } from "./api";

          const fetchMock = vi.fn<typeof fetch>(async () =>
            new Response(JSON.stringify({ ok: true }), {
              status: 200,
              headers: { "Content-Type": "application/json" },
            }),
          );
          beforeEach(() => {
            fetchMock.mockClear();
            vi.stubGlobal("fetch", fetchMock);
            window.__HERMES_SESSION_TOKEN__ = "session-token";
            setManagementProfile("work & play");
          });
          afterEach(() => {
            setManagementProfile("");
            delete window.__HERMES_SESSION_TOKEN__;
            vi.unstubAllGlobals();
          });
          function request(index = 0) {
            const [url, init] = fetchMock.mock.calls[index];
            return { url, init, body: init?.body ? JSON.parse(String(init.body)) : undefined };
          }
          describe("MCP public api facade", () => {
            it.each([undefined, "auto", "local", "windows"] as const)("preserves catalog network=%s without adding a legacy default", async (network) => {
              await api.installMcpCatalogEntry("unity", { TEST_KEY: "test-only" }, false, network);
              expect(request().url).toBe("/api/mcp/catalog/install?profile=work%20%26%20play");
              expect(request().body).toEqual({ name: "unity", env: { TEST_KEY: "test-only" }, enable: false, ...(network ? { network } : {}) });
              expect(request().init?.method).toBe("POST");
            });
            it.each(["auto", "local", "windows"] as const)("preserves HTTP and SSE creation network=%s", async (network: McpNetwork) => {
              for (const transport of ["http", "sse"] as const) {
                const body = { name: "unity", url: "http://localhost:8080/mcp", network, transport, auth: "header" as const, bearer_token: "fixture-token" };
                await api.addMcpServer(body);
                expect(request(fetchMock.mock.calls.length - 1).body).toEqual(body);
              }
              for (const [url, init] of fetchMock.mock.calls) {
                expect(url).toBe("/api/mcp/servers?profile=work%20%26%20play");
                expect(init?.credentials).toBe("include");
                expect(new Headers(init?.headers).get("X-Hermes-Session-Token")).toBe("session-token");
              }
            });
            it("keeps all MCP routes and escaping on the current management profile", async () => {
              await api.getMcpServers();
              await api.getMcpCatalog();
              await api.authMcpServer("a/b");
              await api.getMcpOAuthFlow("flow/id");
              await api.removeMcpServer("a/b");
              await api.testMcpServer("a/b");
              await api.setMcpServerEnabled("a/b", false);
              const paths = ["/api/mcp/servers", "/api/mcp/catalog", "/api/mcp/servers/a%2Fb/auth", "/api/mcp/oauth/flows/flow%2Fid", "/api/mcp/servers/a%2Fb", "/api/mcp/servers/a%2Fb/test", "/api/mcp/servers/a%2Fb/enabled"];
              expect(fetchMock.mock.calls.map(([url]) => url)).toEqual(paths.map(path => `${path}?profile=work%20%26%20play`));
              expect(fetchMock.mock.calls.map(([, init]) => init?.method ?? "GET")).toEqual(["GET", "GET", "POST", "GET", "DELETE", "POST", "PUT"]);
              expect(request(6).body).toEqual({ enabled: false });
              setManagementProfile("next");
              await api.getMcpServers();
              expect(request(7).url).toBe("/api/mcp/servers?profile=next");
            });
            it("keeps gated cookie auth and stdio payloads without inventing network", async () => {
              delete window.__HERMES_SESSION_TOKEN__;
              window.__HERMES_AUTH_REQUIRED__ = true;
              try {
                const body = { name: "time", command: "uvx", args: ["mcp-server-time"] };
                await api.addMcpServer(body);
                expect(request().body).toEqual(body);
                expect(request().init?.credentials).toBe("include");
                expect(new Headers(request().init?.headers).has("X-Hermes-Session-Token")).toBe(false);
              } finally {
                delete window.__HERMES_AUTH_REQUIRED__;
              }
            });
          });
          TS
          npm run test --workspace web -- --run src/lib/api-mcp.test.ts src/lib/api.test.ts src/lib/mcp-network.test.ts src/lib/mcp-server-create.test.ts
      - name: Extract MCP methods and wire types without changing their bodies
        run: |
          cat > /tmp/extract-mcp.cjs <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const ts = require(process.cwd() + '/node_modules/typescript');
          const path = 'web/src/lib/api.ts';
          const before = fs.readFileSync(path, 'utf8');
          const split = before.indexOf('/** Identity payload returned');
          assert(split > 0);
          let runtime = before.slice(0, split);
          let contracts = before.slice(split);
          const parsed = ts.createSourceFile('contracts.ts', contracts, ts.ScriptTarget.Latest, true);
          assert(parsed.statements.every(n => ts.isInterfaceDeclaration(n) || ts.isTypeAliasDeclaration(n)), 'tail must be type-only');
          const options = parsed.statements.find(n => n.name.text === 'FetchJSONOptions');
          assert(options);
          const optionsText = contracts.slice(options.pos, options.end);
          contracts = contracts.replace(optionsText, '');
          runtime += optionsText + '\n';
          const typesStart = contracts.indexOf('export interface McpServer {');
          const typesEnd = contracts.indexOf('export interface MessagingPlatformEnvVar');
          assert(typesStart >= 0 && typesEnd > typesStart);
          const mcpTypes = contracts.slice(typesStart, typesEnd);
          contracts = contracts.slice(0, typesStart) + contracts.slice(typesEnd);
          const methodStart = runtime.indexOf('  // ── Admin: MCP servers');
          const methodEnd = runtime.indexOf('  // ── Admin: Pairing', methodStart);
          assert(methodStart >= 0 && methodEnd > methodStart);
          const methods = runtime.slice(methodStart, methodEnd);
          runtime = runtime.slice(0, methodStart) + '  ...createMcpApi(fetchJSON),\n\n' + runtime.slice(methodEnd);
          const themeImport = 'import type { DashboardTheme } from "@/themes/types";\n';
          assert(runtime.includes(themeImport));
          runtime = runtime.replace(themeImport, '');
          const responseTypes = ts.createSourceFile('api-types.ts', contracts, ts.ScriptTarget.Latest, true);
          const exported = responseTypes.statements.map(n => n.name.text);
          const used = new Set();
          const visit = n => { if (ts.isIdentifier(n)) used.add(n.text); ts.forEachChild(n, visit); };
          visit(ts.createSourceFile('api.ts', runtime, ts.ScriptTarget.Latest, true));
          const imports = exported.filter(name => used.has(name));
          const head = 'import { createMcpApi } from "./api-mcp";\nimport type { ' + imports.join(', ') + ' } from "./api-types";\n\nexport type * from "./api-types";\nexport type * from "./api-mcp";\n\n';
          const mcp = '/** MCP administration uses the facade\'s existing authenticated, profile-scoped transport. */\nexport function createMcpApi(\n  fetchJSON: <T>(url: string, init?: RequestInit) => Promise<T>,\n) {\n  return {\n' + methods + '  };\n}\n\n' + mcpTypes;
          fs.writeFileSync(path, head + runtime);
          fs.writeFileSync('web/src/lib/api-types.ts', '/** Dashboard request/response wire contracts; re-exported by api.ts. */\n' + themeImport + '\n' + contracts);
          fs.writeFileSync('web/src/lib/api-mcp.ts', mcp);
          // Preserve the exact text of every moved declaration and MCP method.
          assert(mcp.includes(methods) && mcp.includes(mcpTypes));
          assert(fs.readFileSync('web/src/lib/api-types.ts', 'utf8').includes(contracts));
          for (const file of [path, 'web/src/lib/api-types.ts', 'web/src/lib/api-mcp.ts']) {
            const count = fs.readFileSync(file, 'utf8').split('\n').length;
            console.log(file, count, 'lines');
            assert(count <= 2000, file);
          }
          JS
          node /tmp/extract-mcp.cjs
      - name: Move long commented provider examples into their existing guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cli-config.yaml.example')
          before = p.read_text()
          a = before.index('  # Azure Foundry keyless auth example:')
          b = before.index('# =============================================================================\n# Unified Timeouts', a)
          excerpt = before[a:b]
          assert all(not line.strip() or line.lstrip().startswith('#') for line in excerpt.splitlines())
          link = '  # Advanced provider examples (Azure auth, token limits, custom headers,\n  # command-minted credentials and per-provider timeouts) are preserved in:\n  # website/docs/user-guide/configuring-models.md#advanced-provider-configuration-examples\n\n'
          after = before[:a] + link + before[b:]
          active = lambda text: [line for line in text.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert active(before) == active(after), 'no active configuration line may change'
          docs = Path('website/docs/user-guide/configuring-models.md')
          old_docs = docs.read_text()
          title = '## Advanced provider configuration examples'
          assert title not in old_docs
          addition = '\n\n' + title + '\n\nThe following commented examples were moved from `cli-config.yaml.example`.\nThey retain all settings, precedence notes and credential-safety guidance.\nCopy only the relevant example into your active profile: model options belong\nunder `model`, while `providers` is a top-level mapping.\n\n```yaml\n' + excerpt.rstrip() + '\n```\n'
          docs.write_text(old_docs.rstrip() + addition)
          p.write_text(after)
          assert excerpt.rstrip() in docs.read_text(), 'examples and guidance must survive verbatim'
          for file in (p, docs):
            count = len(file.read_text().splitlines())
            print(file, count, 'lines')
            assert count <= 2000, (file, count)
          PY
      - name: Validate behavior, style and both frontend consumers
        run: |
          npx eslint --fix web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts
          npm run test --workspace web -- --run --reporter=verbose
          npm run test --workspace apps/desktop -- --project ui src/api/mcp-network.test.ts src/lib/mcp-probe-cache.test.ts --reporter=verbose
          npx tsc -p web/tsconfig.app.json --noEmit
          npx tsc -p apps/desktop/tsconfig.json --noEmit
          npx eslint web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for name in ['web/src/lib/api.ts', 'web/src/lib/api-types.ts', 'web/src/lib/api-mcp.ts', 'web/src/lib/api-mcp.test.ts', 'cli-config.yaml.example', 'website/docs/user-guide/configuring-models.md']:
            count = len(Path(name).read_text().splitlines())
            print(name, count)
            assert count <= 2000
          PY
      - name: Publish only the verified product delta
        run: |
          git diff --stat
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git add web/src/lib/api.ts web/src/lib/api-types.ts web/src/lib/api-mcp.ts web/src/lib/api-mcp.test.ts cli-config.yaml.example website/docs/user-guide/configuring-models.md
          git commit -m 'refactor(mcp): extract dashboard contracts and preserve configuration guidance' -m "Addresses andrexibiza's extraction-before-growth review. Validated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: facade request parity before/after, full web tests, Desktop MCP suites, both frontend typechecks, focused ESLint, unchanged active config and preserved examples. No change to Python transport or routing policy."
          git push origin "HEAD:refs/heads/automation/biza-107713-${GITHUB_RUN_ID}"
          echo "107713 candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
