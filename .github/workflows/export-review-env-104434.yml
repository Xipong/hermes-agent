name: Export locked PR 104434 review environment
on:
  push:
    branches: [automation/port-76230-over-104299]
    paths: [.github/workflows/export-review-env-104434.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NousResearch/hermes-agent
          ref: e9bccc90a5e314ddf6dd4bd3772d50cb40027275
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v7
      - run: uv sync --locked --python 3.13 --extra dev --extra messaging --extra anthropic
      - run: uv pip install 'pexpect==4.9.0'
      - name: Export dependency bytes (no credentials or user state)
        run: |
          mkdir -p /tmp/review-env
          tar czf /tmp/review-env/site-packages.tar.gz -C .venv/lib/python3.13/site-packages .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-104434-env
          path: /tmp/review-env/
          retention-days: 1
