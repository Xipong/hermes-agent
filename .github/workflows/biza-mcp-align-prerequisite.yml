name: Biza MCP prerequisite alignment
on:
  push:
    branches: [automation/biza-mcp-align-prerequisite-20260912]
permissions:
  contents: write
jobs:
  align:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 39a7fd6b60d448bd943dbae2c7711193050022e8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - name: Replay the pinned prerequisite composition and verification
        run: |
          git fetch --no-tags --depth=1 origin 2d440d963cedd1edac7d5ffc12934875f9aec7ca
          git show 2d440d963cedd1edac7d5ffc12934875f9aec7ca:.github/workflows/biza-mcp-align-prerequisite.yml > /tmp/biza-alignment.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('/tmp/biza-alignment.yml').read_text()
          names = [
              'Reuse the existing prerequisite instead of a parallel extraction',
              'Install locked dependencies',
              'Port only the same direct type ownership, retaining MCP additions',
              'Verify the actual composed frontend tree',
              'Validate scoped lint, ownership and all bounded files',
              'Publish normal follow-up with the previously published head as parent',
          ]
          for name in names:
              marker = '      - name: ' + name + '\n        run: |\n'
              assert text.count(marker) == 1, name
              block = text.split(marker, 1)[1].split('\n      - ', 1)[0]
              lines = block.splitlines()
              assert all(not line.strip() or line.startswith('          ') for line in lines), name
              script = '\n'.join(line[10:] if line.startswith('          ') else '' for line in lines) + '\n'
              print('Executing pinned stage:', name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script], check=True)
              if name == 'Port only the same direct type ownership, retaining MCP additions':
                  path = Path('web/src/lib/api.ts')
                  previous = path.read_text()
                  normalized = previous.rstrip() + '\n'
                  assert normalized.rstrip() == previous.rstrip()
                  path.write_text(normalized)
          PY
