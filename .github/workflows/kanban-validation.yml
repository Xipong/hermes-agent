name: Kanban opt-in validation
on:
  push:
    branches: [work/kanban-opt-in-validation-20260911]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 2ddeba9e17a1df5471802481e3efef20885a20b2
          path: src
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Install root-locked JS workspace
        working-directory: src
        run: npm ci --ignore-scripts
      - name: Reproduce missing agent control before fix
        working-directory: src/apps/desktop
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kanban-ui-evidence"
          cp ../../../harness/plugins-tab-kanban.test.tsx src/app/skills/
          set +e
          npx vitest run --project ui src/app/skills/plugins-tab-kanban.test.tsx -t 'keeps Desktop' 2>&1 | tee "$RUNNER_TEMP/kanban-ui-evidence/base.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Eq 'Unable to find|TestingLibraryElementError' "$RUNNER_TEMP/kanban-ui-evidence/base.log"
      - name: Apply Desktop candidate
        working-directory: src
        run: python ../harness/apply_desktop.py
      - name: Format, lint, typecheck and execute UI tests
        working-directory: src/apps/desktop
        shell: bash
        run: |
          files=(src/app/skills/index.tsx src/app/skills/plugins-tab.tsx src/app/skills/store.ts src/app/skills/kanban-toolset-control.tsx src/app/skills/plugins-tab-kanban.test.tsx src/i18n/en.ts src/i18n/ru.ts src/i18n/zh.ts src/i18n/zh-hant.ts src/i18n/ja.ts src/i18n/ar.ts src/i18n/types.ts)
          npx eslint --fix "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/kanban-ui-evidence/lint.log"
          npx prettier --write "${files[@]}"
          npx eslint "${files[@]}"
          npx tsc -p tsconfig.json --noEmit 2>&1 | tee "$RUNNER_TEMP/kanban-ui-evidence/types.log"
          npx vitest run --project ui src/app/skills/plugins-tab-kanban.test.tsx src/app/skills/plugins-tab.test.tsx src/app/skills/plugin-packages.test.ts src/app/skills/index.test.tsx src/lib/desktop-toolsets.test.ts src/i18n/languages.test.ts 2>&1 | tee "$RUNNER_TEMP/kanban-ui-evidence/candidate.log"
          git add "${files[@]}"
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/kanban-ui-evidence/desktop.patch"
      - name: Publish independent product-only Desktop branch
        working-directory: src
        shell: bash
        run: |
          git config user.name Xipong
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git commit -m 'fix(desktop): expose a separate profile-scoped Kanban tools switch'
          branch=fix/desktop-kanban-agent-tools-20260911
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch --depth=1 origin "$branch"
            git diff --exit-code FETCH_HEAD HEAD
            git rev-parse FETCH_HEAD > "$RUNNER_TEMP/kanban-ui-evidence/desktop-head.txt"
          else
            git push origin "HEAD:refs/heads/$branch"
            git rev-parse HEAD > "$RUNNER_TEMP/kanban-ui-evidence/desktop-head.txt"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kanban-desktop-evidence
          path: ${{ runner.temp }}/kanban-ui-evidence
          retention-days: 7
