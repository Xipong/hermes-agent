name: Rebase selected PR branches 2026-10-15

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebase-selected-prs-20261015.yml
      - .github/rebase-selected-prs-20261015.trigger
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/rebase-selected-prs-20261015.pr-trigger

permissions:
  contents: write

jobs:
  rebase:
    name: Rebase PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pr:
          - 107739
          - 107842
          - 108240
          - 108661
          - 109291
          - 109330
          - 109332
          - 109351
          - 109402
          - 109474

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase and update branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git config rerere.enabled true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

          pr_json="$(gh api "repos/NousResearch/hermes-agent/pulls/${PR_NUMBER}")"
          target_branch="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          expected_head="$(jq -r '.head.sha' <<<"${pr_json}")"
          is_draft="$(jq -r '.draft' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"

          if [[ "${head_repo}" != "Xipong/hermes-agent" ]]; then
            echo "Unexpected head repository: ${head_repo}" >&2
            exit 40
          fi
          if [[ "${state}" != "open" || "${is_draft}" != "false" ]]; then
            echo "PR ${PR_NUMBER} is not open and ready: state=${state}, draft=${is_draft}" >&2
            exit 41
          fi

          git fetch --no-tags origin "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          actual_head="$(git rev-parse "refs/remotes/origin/${target_branch}")"
          if [[ "${actual_head}" != "${expected_head}" ]]; then
            echo "Branch moved: expected ${expected_head}, found ${actual_head}" >&2
            exit 42
          fi

          git checkout --detach "${actual_head}"

          if ! git rebase --rebase-merges refs/remotes/upstream/main; then
            diag_root="$(mktemp -d)"
            mkdir -p "${diag_root}/rebase-conflicts"
            git status --porcelain=v2 > "${diag_root}/rebase-conflicts/status.txt" || true
            git ls-files -u > "${diag_root}/rebase-conflicts/index-stages.txt" || true
            git diff --cc > "${diag_root}/rebase-conflicts/combined.diff" || true
            git log --oneline --decorate -30 > "${diag_root}/rebase-conflicts/recent-commits.txt" || true
            printf '%s\n' \
              "pr=${PR_NUMBER}" \
              "source_branch=${target_branch}" \
              "expected_head=${expected_head}" \
              "upstream_main=$(git rev-parse refs/remotes/upstream/main)" \
              "run_id=${GITHUB_RUN_ID}" \
              > "${diag_root}/rebase-conflicts/metadata.txt"

            while IFS= read -r -d '' path; do
              for side in base ours theirs; do
                case "${side}" in
                  base) stage=1 ;;
                  ours) stage=2 ;;
                  theirs) stage=3 ;;
                esac
                mkdir -p "${diag_root}/rebase-conflicts/${side}/$(dirname "${path}")"
                git show ":${stage}:${path}" > "${diag_root}/rebase-conflicts/${side}/${path}" 2>/dev/null || true
              done
              if [[ -f "${path}" ]]; then
                mkdir -p "${diag_root}/rebase-conflicts/worktree/$(dirname "${path}")"
                cp "${path}" "${diag_root}/rebase-conflicts/worktree/${path}"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            git rebase --abort || true
            diag_branch="diagnostics/rebase-${PR_NUMBER}-${GITHUB_RUN_ID}"
            git switch --orphan "${diag_branch}"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
            cp -a "${diag_root}/rebase-conflicts" .
            git add rebase-conflicts
            git commit -m "chore: capture PR ${PR_NUMBER} rebase conflicts"
            git push --force origin "HEAD:refs/heads/${diag_branch}"
            echo "Rebase conflict diagnostics: ${diag_branch}" >&2
            exit 43
          fi

          new_head="$(git rev-parse HEAD)"
          echo "PR ${PR_NUMBER}: ${target_branch}: ${expected_head} -> ${new_head}"
          git push --force-with-lease="refs/heads/${target_branch}:${expected_head}" origin "HEAD:refs/heads/${target_branch}"
