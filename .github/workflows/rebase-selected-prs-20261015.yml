name: Rebase selected PR branches 2026-10-15

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

jobs:
  rebase:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/rebase-selected-prs')
    name: Rebase PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pr:
          - 107739
          - 107842
          - 108661
          - 109330
          - 109351
          - 109402
          - 109474

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge PR delta onto current upstream main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || true
          git fetch --no-tags upstream main

          pr_json="$(gh api "repos/NousResearch/hermes-agent/pulls/${PR_NUMBER}")"
          target_branch="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          expected_head="$(jq -r '.head.sha' <<<"${pr_json}")"
          title="$(jq -r '.title' <<<"${pr_json}")"
          is_draft="$(jq -r '.draft' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"

          if [[ "${head_repo}" != "Xipong/hermes-agent" ]]; then
            echo "Unexpected head repository: ${head_repo}" >&2
            exit 40
          fi
          if [[ "${state}" != "open" || "${is_draft}" != "false" ]]; then
            echo "PR ${PR_NUMBER} is not open and ready: state=${state}, draft=${is_draft}" >&2
            exit 41
          fi

          git fetch --no-tags origin "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          actual_head="$(git rev-parse "refs/remotes/origin/${target_branch}")"
          if [[ "${actual_head}" != "${expected_head}" ]]; then
            echo "Branch moved: expected ${expected_head}, found ${actual_head}" >&2
            exit 42
          fi

          upstream_main="$(git rev-parse refs/remotes/upstream/main)"
          merge_base="$(git merge-base "${upstream_main}" "${actual_head}")"
          mapfile -d '' changed_paths < <(git diff --name-only -z "${merge_base}" "${actual_head}")

          git checkout --detach "${upstream_main}"
          set +e
          git merge --no-commit --no-ff "${actual_head}"
          merge_rc=$?
          set -e

          if [[ ${merge_rc} -eq 0 ]]; then
            tree="$(git write-tree)"
            new_head="$(printf '%s\n' "${title}" | git commit-tree "${tree}" -p "${upstream_main}")"
            echo "PR ${PR_NUMBER}: ${target_branch}: ${expected_head} -> ${new_head}"
            git push --force-with-lease="refs/heads/${target_branch}:${expected_head}" origin "${new_head}:refs/heads/${target_branch}"
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          bundle="conflict-bundle"
          mkdir -p "${bundle}/result" "${bundle}/stages/base" "${bundle}/stages/ours" "${bundle}/stages/theirs" "${bundle}/worktree"
          printf '%s\n' \
            "pr=${PR_NUMBER}" \
            "source_branch=${target_branch}" \
            "expected_head=${expected_head}" \
            "upstream_main=${upstream_main}" \
            "merge_base=${merge_base}" \
            "run_id=${GITHUB_RUN_ID}" \
            > "${bundle}/metadata.txt"
          git status --porcelain=v2 > "${bundle}/status.txt" || true
          git ls-files -u > "${bundle}/index-stages.txt" || true
          git diff --cc > "${bundle}/combined.diff" || true
          git diff --name-only --diff-filter=U > "${bundle}/conflicted-paths.txt" || true
          git diff --name-status "${merge_base}" "${actual_head}" > "${bundle}/pr-paths.txt" || true

          for path in "${changed_paths[@]}"; do
            if [[ -e "${path}" || -L "${path}" ]]; then
              mkdir -p "${bundle}/result/$(dirname "${path}")"
              cp -a "${path}" "${bundle}/result/${path}"
            else
              printf '%s\n' "${path}" >> "${bundle}/deleted-paths.txt"
            fi
          done

          while IFS= read -r -d '' path; do
            for side in base ours theirs; do
              case "${side}" in
                base) stage=1 ;;
                ours) stage=2 ;;
                theirs) stage=3 ;;
              esac
              mkdir -p "${bundle}/stages/${side}/$(dirname "${path}")"
              git show ":${stage}:${path}" > "${bundle}/stages/${side}/${path}" 2>/dev/null || true
            done
            if [[ -e "${path}" || -L "${path}" ]]; then
              mkdir -p "${bundle}/worktree/$(dirname "${path}")"
              cp -a "${path}" "${bundle}/worktree/${path}"
            fi
          done < <(git diff --name-only --diff-filter=U -z)

          echo "conflict=true" >> "${GITHUB_OUTPUT}"

      - name: Upload conflict bundle
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebase-${{ matrix.pr }}-${{ github.run_id }}
          path: conflict-bundle
          if-no-files-found: error
          retention-days: 1
