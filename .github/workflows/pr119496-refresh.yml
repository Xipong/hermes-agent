name: PR119496 refresh validation

on:
  push:
    branches:
      - workbench/pr119496-refresh
  pull_request:
    branches:
      - workbench/pr119496-refresh

permissions:
  contents: read

concurrency:
  group: pr119496-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Export base, main, and head snapshots
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          branches=(
            '110363:fix/update-provider-model-cache-refresh'
            '110364:fix/kanban-stop-owned-run'
            '110395:feat/mcp-profile-discovery'
            '110447:fix/desktop-memory-recall'
            '112476:fix/bundled-skill-write-approval'
            '112494:fix/bundled-local-references'
            '114565:fix/wsl-computer-use-host-target'
            '115087:fix/desktop-stale-subagent-roster'
          )
          for spec in "${branches[@]}"; do
            branch="${spec#*:}"
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done

          python - <<'PY'
          import json
          import pathlib
          import subprocess

          specs = [
              ("110363", "fix/update-provider-model-cache-refresh"),
              ("110364", "fix/kanban-stop-owned-run"),
              ("110395", "feat/mcp-profile-discovery"),
              ("110447", "fix/desktop-memory-recall"),
              ("112476", "fix/bundled-skill-write-approval"),
              ("112494", "fix/bundled-local-references"),
              ("114565", "fix/wsl-computer-use-host-target"),
              ("115087", "fix/desktop-stale-subagent-roster"),
          ]
          root = pathlib.Path("rebase-inputs")
          root.mkdir()

          def run(*args: str, text: bool = True):
              return subprocess.run(args, check=True, capture_output=True, text=text).stdout

          for number, branch in specs:
              head = run("git", "rev-parse", f"origin/{branch}").strip()
              main = run("git", "rev-parse", "upstream/main").strip()
              base = run("git", "merge-base", main, head).strip()
              raw = run("git", "diff", "--name-status", "-z", base, head, text=False)
              tokens = raw.split(b"\0")
              paths = []
              changes = []
              i = 0
              while i < len(tokens) and tokens[i]:
                  status = tokens[i].decode("utf-8", "surrogateescape")
                  i += 1
                  if status.startswith(("R", "C")):
                      old = tokens[i].decode("utf-8", "surrogateescape")
                      new = tokens[i + 1].decode("utf-8", "surrogateescape")
                      i += 2
                      changes.append([status, old, new])
                      paths.extend([old, new])
                  else:
                      path = tokens[i].decode("utf-8", "surrogateescape")
                      i += 1
                      changes.append([status, path])
                      paths.append(path)
              paths = list(dict.fromkeys(paths))

              out = root / number
              out.mkdir()
              (out / "metadata.json").write_text(
                  json.dumps(
                      {"number": number, "branch": branch, "base": base, "main": main, "head": head, "changes": changes},
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )
              patch = subprocess.run(
                  ["git", "diff", "--binary", "--full-index", base, head],
                  check=True,
                  capture_output=True,
              ).stdout
              (out / "original.patch").write_bytes(patch)

              for side, commit in (("base", base), ("main", main), ("head", head)):
                  side_root = out / side
                  side_root.mkdir()
                  missing = []
                  for path in paths:
                      probe = subprocess.run(
                          ["git", "cat-file", "-e", f"{commit}:{path}"],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                      )
                      if probe.returncode:
                          missing.append(path)
                          continue
                      data = subprocess.run(
                          ["git", "show", f"{commit}:{path}"],
                          check=True,
                          capture_output=True,
                      ).stdout
                      target = side_root / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                  (out / f"{side}-missing.json").write_text(
                      json.dumps(missing, indent=2) + "\n", encoding="utf-8"
                  )
          PY

      - name: Upload rebase inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rebase-inputs-${{ github.sha }}
          path: rebase-inputs
          retention-days: 3
          if-no-files-found: error
