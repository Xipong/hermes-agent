name: Issue 125766 history workbench
on:
  push:
    branches: [workbench/issue125766-history]
permissions:
  contents: write
concurrency:
  group: issue125766-history-workbench
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Export source for isolated inspection
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/history-evidence"
          git archive HEAD apps/desktop apps/shared AGENTS.md hermes_state_timeline.py hermes_cli/web_routers/sessions.py tests/hermes_cli/test_session_timeline.py .github/actions/setup-pm scripts | gzip > "$RUNNER_TEMP/history-evidence/source.tar.gz"
      - name: Prepare locked test toolchains
        if: hashFiles('workbench/history_fix.py') != ''
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic"]'
          test-environment: 'true'
          cache-suffix: issue125766-history
      - name: Apply and verify candidate
        if: hashFiles('workbench/history_fix.py') != ''
        run: '"$HERMES_PYTHON" workbench/history_fix.py'
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_TIMEOUT: '300'
          HERMES_TEST_FILE_RETRIES: '0'
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue125766-history-evidence
          path: ${{ runner.temp }}/history-evidence/
          retention-days: 7
