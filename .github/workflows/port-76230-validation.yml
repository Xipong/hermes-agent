name: Validate isolated 76230 port
on:
  push:
    branches: [work/delegation-inject-104299]
    paths: [_port_76230.py]
permissions:
  contents: write
concurrency:
  group: port-76230-validation
  cancel-in-progress: true
jobs:
  port:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: 14ca27fa0601144b6ea4af1408a3b37c22456072
      FEATURE: feat/delegation-inject-over-104299
      PORT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Build a clean feature commit (no validation scaffolding)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cp _port_76230.py "$RUNNER_TEMP/port_76230.py"
          git checkout --detach "$BASE"
          python "$RUNNER_TEMP/port_76230.py"
          git diff --check
          python - <<'PY'
          import ast, pathlib, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          paths += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).decode().splitlines()
          for name in paths:
              assert not name.startswith('.github/') and name != '_port_76230.py', name
              if name.endswith('.py'):
                  ast.parse(pathlib.Path(name).read_text(), filename=name)
          PY
          git add -A
          tree=$(git write-tree)
          parent="$BASE"
          if git fetch origin "refs/heads/$FEATURE"; then
            parent=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$BASE" "$parent"
          fi
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          commit=$(git commit-tree "$tree" -p "$parent" -m "feat(delegation): carry opted-in completion units at safe tool boundaries" -m "Port the behavior contract of NousResearch/hermes-agent#76230 onto the completion units merged in #104299. The old PR remains the reference implementation and test oracle; no old child ledger or ready-set stack is imported.")
          git push origin "$commit:refs/heads/$FEATURE"
          echo "CLEAN_FEATURE_SHA=$commit" | tee -a "$GITHUB_ENV"
          git diff --stat "$BASE" "$commit"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
      - name: Install test dependencies
        id: deps
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Port regression tests
        env:
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NOUS_API_KEY: ''
        run: .venv/bin/python -m pytest tests/agent/test_delegation_unit_inject.py -q --tb=short
      - name: Existing affected tests (fresh process per file)
        if: always() && steps.deps.outcome == 'success'
        env:
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NOUS_API_KEY: ''
        shell: bash
        run: |
          set +e
          failed=0
          for file in tests/tools/test_async_delegation.py tests/tools/test_delegate_apiserver_background.py tests/tools/test_restored_delegation_ownership.py tests/tools/test_process_registry.py tests/cli/test_cli_async_delegation_delivery.py tests/gateway/test_completion_delivery.py tests/test_tui_gateway_server.py; do
            if [ -f "$file" ]; then
              .venv/bin/python -m pytest "$file" -q --tb=short || failed=1
            fi
          done
          exit "$failed"
      - name: Changed Python lint
        if: always() && steps.deps.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACM "$BASE" "$CLEAN_FEATURE_SHA" -- '*.py' > /tmp/changed-python.txt
          xargs -r .venv/bin/ruff check < /tmp/changed-python.txt
