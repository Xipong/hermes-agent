name: Desktop observability validation
on:
  push:
    branches: [work/desktop-observability-20260910]
permissions:
  contents: write
jobs:
  validate:
    if: startsWith(github.event.head_commit.message, 'publish:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pr: [1, 2, 3]
    env:
      PR_NUMBER: ${{ matrix.pr }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Reconstruct and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, re, urllib.request
          root = 'https://raw.githubusercontent.com/Xipong/hermes-agent/' + os.environ['GITHUB_SHA'] + '/'
          def read(path):
              with urllib.request.urlopen(root + path, timeout=60) as response:
                  return response.read().decode()
          bundle = json.loads(read('.github/desktop-observability-patches.json'))
          entry = next(p for p in bundle['prs'] if p['number'] == int(os.environ['PR_NUMBER']))
          assert re.fullmatch(r'[0-9a-f]{40}', bundle['base'])
          assert re.fullmatch(r'(fix|feat)/desktop-[a-z0-9-]+', entry['branch'])
          assert all(p.startswith('apps/desktop/src/') and '..' not in p.split('/') for p in entry['files'])
          assert all(re.fullmatch(r'\.github/desktop-pr-[a-z0-9.-]+', p) for p in entry['parts'])
          encoded = ''.join(read(p).strip() for p in entry['parts'])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == entry['sha256']
          pathlib.Path('change.patch').write_bytes(patch)
          pathlib.Path('entry.json').write_text(json.dumps(entry))
          pathlib.Path('base.txt').write_text(bundle['base'])
          PY
          mkdir source receipts
          cd source
          git init
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git -c protocol.version=2 fetch --filter=blob:none --depth=1 upstream "$(cat ../base.txt)"
          git sparse-checkout init --cone
          git sparse-checkout set apps ui-tui web tests-js tests/fixtures .github
          git checkout --detach FETCH_HEAD
          git apply --check ../change.patch
          git apply ../change.patch
          git add apps/desktop/src
          python3 - <<'PY'
          import json, pathlib, subprocess
          expected = set(json.loads(pathlib.Path('../entry.json').read_text())['files'])
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
          git diff --cached --check
          git rev-parse HEAD | tee ../receipts/base.txt
          git diff --cached --stat | tee ../receipts/change-stat.txt
      - name: Install pinned dependencies without lifecycle scripts
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regressions, renderer typecheck, lint and formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ../receipts/tests.txt
          import json, pathlib, subprocess
          entry = json.loads(pathlib.Path('../entry.json').read_text())
          subprocess.run(['node', '../../node_modules/vitest/vitest.mjs', 'run', '--project', 'ui', '--maxWorkers=2', *entry['tests']], cwd='apps/desktop', check=True)
          PY
          node node_modules/typescript/bin/tsc -p apps/desktop --noEmit 2>&1 | tee ../receipts/typecheck.txt
          git diff --cached --name-only -z | xargs -0 node node_modules/eslint/bin/eslint.js --max-warnings 0 2>&1 | tee ../receipts/lint.txt
          git diff --cached --name-only -z | xargs -0 node node_modules/prettier/bin/prettier.cjs --check 2>&1 | tee ../receipts/format.txt
          git diff --check
          git diff --exit-code
      - name: Publish the validated product-only branch
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(python3 -c 'import json; print(json.load(open("../entry.json"))["branch"])')
          message=$(python3 -c 'import json; p=json.load(open("../entry.json")); print(p["message"] + "\n\nFixes NousResearch/hermes-agent#" + str(p["issue"]))')
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git commit -m "$message"
          remote=https://github.com/Xipong/hermes-agent.git
          if git ls-remote --exit-code --heads "$remote" "$branch"; then
            git fetch --depth=1 "$remote" "$branch"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
            git rev-parse FETCH_HEAD | tee ../receipts/head.txt
          else
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$remote" "HEAD:refs/heads/$branch"
            git rev-parse HEAD | tee ../receipts/head.txt
          fi
          printf '%s\n' "$branch" | tee ../receipts/branch.txt
      - name: Preserve validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-pr-${{ matrix.pr }}-validation
          path: receipts/
          retention-days: 7
          if-no-files-found: warn
