name: Desktop observability workspace

on:
  push:
    branches: [work/desktop-observability-20260910]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned workspace dependencies
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          mkdir source
          cd source
          git init
          git remote add origin https://github.com/NousResearch/hermes-agent.git
          git -c protocol.version=2 fetch --filter=blob:none --depth=1 origin 16a408534c4c2364e8e8f14ea7cef82aa80b4505
          git sparse-checkout init --cone
          git sparse-checkout set apps ui-tui web tests-js .github
          git checkout --detach FETCH_HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p test-runtime
          cp "$(command -v node)" test-runtime/node
          find . -type d -name node_modules -prune -print0 > dependency-paths
          printf 'test-runtime\0' >> dependency-paths
          tar --null -T dependency-paths -czf ../desktop-dependencies.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-observability-dependencies
          path: desktop-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
