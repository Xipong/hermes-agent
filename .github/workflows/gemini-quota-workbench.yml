name: Gemini quota regression workbench
on:
  push:
    branches: [work/gemini-quota-scope-20260912]
    paths:
      - .github/workflows/gemini-quota-workbench.yml
      - .github/gemini_quota_workbench*.py
permissions:
  contents: write
concurrency:
  group: gemini-quota-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1
      - name: Install repository test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q 'uv==0.8.22'
          .venv/bin/uv pip install --python .venv/bin/python -q -e '.[dev]'
      - name: Prove baseline failures, verify fix, and publish clean branch
        env:
          HERMES_TEST_FILE_RETRIES: '0'
        run: .venv/bin/python .github/gemini_quota_workbench_v2.py
