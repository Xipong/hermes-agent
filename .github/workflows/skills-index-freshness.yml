name: Skills Index Freshness Check

on:
  workflow_run:
    workflows:
      - Issue 125766 history workbench
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-rebase-selected-prs-106252-123218
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository == 'Xipong/hermes-agent'
    name: Rebase PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pr:
          - 106252
          - 106917
          - 107299
          - 107350
          - 107713
          - 123218

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase PR branch onto its current upstream base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Xipong"
          git config user.email "217837358+Xipong@users.noreply.github.com"
          git config rerere.enabled true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git

          pr_json="$(gh api "repos/NousResearch/hermes-agent/pulls/${PR_NUMBER}")"
          source_branch="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          expected_head="$(jq -r '.head.sha' <<<"${pr_json}")"
          base_branch="$(jq -r '.base.ref' <<<"${pr_json}")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"

          test "$head_repo" = "Xipong/hermes-agent"
          test "$base_repo" = "NousResearch/hermes-agent"
          test "$state" = "open"
          test "$draft" = "false"

          git fetch --no-tags upstream "+refs/heads/${base_branch}:refs/remotes/upstream/${base_branch}"
          base_ref="refs/remotes/upstream/${base_branch}"
          base_head="$(git rev-parse "$base_ref")"
          git fetch --no-tags origin "+refs/heads/${source_branch}:refs/remotes/origin/${source_branch}"
          test "$(git rev-parse "refs/remotes/origin/${source_branch}")" = "$expected_head"

          git checkout -B "$source_branch" "refs/remotes/origin/${source_branch}"
          if git merge-base --is-ancestor "$base_ref" HEAD; then
            printf 'PR %s already contains %s at %s\n' "$PR_NUMBER" "$base_branch" "$base_head"
            exit 0
          fi

          fork_point="$(git merge-base HEAD "$base_ref")"
          git rebase --rebase-merges -X theirs --onto "$base_ref" "$fork_point"

          git diff --check "$base_ref"...HEAD
          test -z "$(git status --porcelain)"
          new_head="$(git rev-parse HEAD)"
          if test "$new_head" = "$expected_head"; then
            printf 'PR %s unchanged at %s on %s %s\n' "$PR_NUMBER" "$new_head" "$base_branch" "$base_head"
            exit 0
          fi
          git push --force-with-lease="refs/heads/${source_branch}:${expected_head}" origin "HEAD:refs/heads/${source_branch}"
          printf 'PR %s: %s -> %s on %s %s\n' "$PR_NUMBER" "$expected_head" "$new_head" "$base_branch" "$base_head"
