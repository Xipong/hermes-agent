name: temp-actions-probe
on:
  push:
    branches: [rebase/actions-probe-20260905]
    paths: [.github/workflows/temp-actions-probe.yml]
permissions:
  contents: write
jobs:
  rebase-deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rebase original DeepSeek PR and port detection to defining modules
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/port_deepseek.py /tmp/port_deepseek.py
          git config user.name Xipong
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream 9dd6634c5635321cf38840cc30e9b51226689128
          test "$(git rev-parse origin/pr/deepseek-thinking-third-party-proxy)" = e44dbf5b9bcaba2533c1cdcb7e0e4b758d00f63f
          git checkout -B __deepseek origin/pr/deepseek-thinking-third-party-proxy
          if GIT_EDITOR=true git rebase 9dd6634c5635321cf38840cc30e9b51226689128; then
            echo 'Unexpected conflict-free replay; refusing unreviewed push' >&2
            exit 1
          fi
          test "$(git diff --name-only --diff-filter=U)" = agent/anthropic_adapter.py
          git checkout --ours -- agent/anthropic_adapter.py
          python /tmp/port_deepseek.py
          git add -u
          test "$(git write-tree)" = 99515013786744b5ddd2a77a43f21bbb362a8b58
          GIT_EDITOR=true git rebase --continue
          git diff --check 9dd6634c5635321cf38840cc30e9b51226689128..HEAD
          test "$(git rev-list --count 9dd6634c5635321cf38840cc30e9b51226689128..HEAD)" -eq 1
      - name: Verify native, DeepSeek relay, and Kimi replay contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv sync --extra dev --frozen
          git diff --name-only 9dd6634c5635321cf38840cc30e9b51226689128..HEAD -- '*.py' | xargs .venv/bin/ruff check
          scripts/run_tests.sh tests/agent/test_anthropic_adapter.py tests/agent/test_deepseek_anthropic_thinking.py tests/agent/test_kimi_coding_anthropic_thinking.py -q
      - name: Update original PR branch after passing checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "NEW_HEAD=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/pr/deepseek-thinking-third-party-proxy --force-with-lease=refs/heads/pr/deepseek-thinking-third-party-proxy:e44dbf5b9bcaba2533c1cdcb7e0e4b758d00f63f
