name: temp-actions-probe

on:
  push:
    branches:
      - rebase/actions-probe-20260905

permissions:
  contents: write

jobs:
  inspect-76480:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect PR 76480 conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/subagent-cli-picker'
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags --depth=1 upstream main:refs/remotes/upstream/main
          git fetch --no-tags --depth=50 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -B __probe "refs/remotes/origin/$branch"
          set +e
          GIT_EDITOR=true git rebase refs/remotes/upstream/main
          rc=$?
          set -e
          echo "REBASE_RC=$rc"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          for f in $(git diff --name-only --diff-filter=U | sort); do
            echo "===== CONFLICT FILE: $f ====="
            git diff --cc -- "$f" | sed -n '1,320p'
          done
          git rebase --abort
