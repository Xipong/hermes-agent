name: temp-actions-probe

on:
  push:
    branches:
      - rebase/actions-probe-20260905

permissions:
  contents: write

jobs:
  rebase-76370:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase PR 76370 into centralized error classifier, test, push
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/aux-resourceexhausted-fallback'

          git config user.name 'Xipong'
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"

          old_head=$(git rev-parse "refs/remotes/origin/$branch")
          upstream_head=$(git rev-parse refs/remotes/upstream/main)
          echo "OLD_HEAD=$old_head"
          echo "UPSTREAM_MAIN=$upstream_head"
          git checkout -B __rebase_76370 "refs/remotes/origin/$branch"

          set +e
          GIT_EDITOR=true git rebase refs/remotes/upstream/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            unmerged=$(git diff --name-only --diff-filter=U)
            if [ "$unmerged" != 'agent/auxiliary_client.py' ]; then
              echo 'Unexpected conflict set:' >&2
              printf '%s\n' "$unmerged" >&2
              exit 1
            fi

            # The old payment classifier moved out of auxiliary_client.py. Keep
            # the current runtime and port this PR's spelling normalization into
            # the centralized classifier instead of resurrecting dead code.
            git checkout --ours -- agent/auxiliary_client.py
            git checkout refs/remotes/upstream/main -- tests/agent/test_auxiliary_client.py

            python - <<'PY'
          from pathlib import Path

          p = Path('agent/error_classifier.py')
          text = p.read_text()
          old = '    "tokens per minute", "requests per day", "try again in", "please retry after", "resource_exhausted",\n'
          new = (
              '    "tokens per minute", "requests per day", "try again in", "please retry after",\n'
              '    "resource exhausted", "resource_exhausted", "resource-exhausted", "resourceexhausted",\n'
          )
          if old not in text:
              raise SystemExit('current _RATE_LIMIT_PATTERNS shape changed')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/agent/test_error_classifier.py')
          text = p.read_text()
          marker = '''    def test_anthropic_429_usage_limit_without_reset_is_billing(self):\n'''
          if marker not in text:
              raise SystemExit('rate-limit test insertion point changed')
          test = '''    @pytest.mark.parametrize("spelling", [\n        "resource exhausted",\n        "RESOURCE_EXHAUSTED",\n        "ResourceExhausted",\n        "resource-exhausted",\n    ])\n    def test_resource_exhausted_separator_variants_without_status(self, spelling):\n        result = classify_api_error(\n            Exception(f"{spelling}: Worker local total request limit reached (32/32)"),\n            provider="nvidia",\n            model="nvidia/nemotron-3-ultra-550b-a55b",\n        )\n        assert result.reason == FailoverReason.rate_limit\n        assert result.retryable is True\n        assert result.should_rotate_credential is True\n        assert result.should_fallback is True\n\n'''
          p.write_text(text.replace(marker, test + marker, 1))
          PY

            git add \
              agent/auxiliary_client.py \
              agent/error_classifier.py \
              tests/agent/test_auxiliary_client.py \
              tests/agent/test_error_classifier.py
            GIT_EDITOR=true git rebase --continue
          fi

          test "$(git merge-base refs/remotes/upstream/main HEAD)" = "$upstream_head"
          test "$(git rev-list --count refs/remotes/upstream/main..HEAD)" -eq 1
          git diff --check refs/remotes/upstream/main..HEAD
          python -m py_compile agent/error_classifier.py agent/auxiliary_client.py

          if ! command -v uv >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check uv
          fi
          uv sync --extra dev --frozen
          scripts/run_tests.sh \
            tests/agent/test_error_classifier.py \
            tests/agent/test_auxiliary_client.py \
            -q

          new_head=$(git rev-parse HEAD)
          echo "NEW_HEAD=$new_head"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          git show --stat --oneline HEAD

          set +e
          git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/$branch:$old_head"
          push_rc=$?
          set -e
          echo "PUSH_RC=$push_rc"
          exit 0
