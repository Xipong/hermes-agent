name: temp-actions-probe

on:
  push:
    branches:
      - rebase/actions-probe-20260905

permissions:
  contents: write

jobs:
  rebase-92486:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase PR 92486, resolve semantic conflict, test, and push
        shell: bash
        run: |
          set -euo pipefail
          branch='pr/defer-update-notice-plain'

          git config user.name 'Xipong'
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"

          old_head=$(git rev-parse "refs/remotes/origin/$branch")
          upstream_head=$(git rev-parse refs/remotes/upstream/main)
          echo "OLD_HEAD=$old_head"
          echo "UPSTREAM_MAIN=$upstream_head"

          git checkout -B __rebase_92486 "refs/remotes/origin/$branch"

          set +e
          GIT_EDITOR=true git rebase refs/remotes/upstream/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            unmerged=$(git diff --name-only --diff-filter=U)
            if [ "$unmerged" != 'hermes_cli/banner.py' ]; then
              echo 'Unexpected conflict set:' >&2
              printf '%s\n' "$unmerged" >&2
              exit 1
            fi

            git checkout --ours -- hermes_cli/banner.py

            python - <<'PY'
          from pathlib import Path

          path = Path('hermes_cli/banner.py')
          text = path.read_text()
          outer = text.index('def _defer_update_notice(')
          start = text.index('    def _wait_and_print() -> None:\n', outer)
          end = text.index('\n\n# === Welcome banner ===', start)
          replacement = '\n'.join([
              '    def _wait_and_print() -> None:',
              '        if not _update_check_done.wait(timeout=max_wait):',
              '            return',
              '        behind = _update_result',
              '        if behind is None or behind == 0:',
              '            return',
              '        # Once patch_stdout() is active, a Rich Console can leak/sanitize ANSI',
              "        # through prompt_toolkit's StdoutProxy. Deferred notices stay plain;",
              '        # the synchronous banner path remains colorized.',
              '        from rich.text import Text',
              '',
              '        print(Text.from_markup(_format_update_notice(behind)).plain)',
              '',
              '    _daemon("update-notice", _wait_and_print)  # never break the session over an update notice',
          ]) + '\n'
          path.write_text(text[:start] + replacement + text[end:])
          PY

            git add hermes_cli/banner.py
            GIT_EDITOR=true git rebase --continue
          fi

          test "$(git merge-base refs/remotes/upstream/main HEAD)" = "$upstream_head"
          test "$(git rev-list --count refs/remotes/upstream/main..HEAD)" -eq 1
          git diff --check refs/remotes/upstream/main..HEAD
          python -m py_compile hermes_cli/banner.py

          if ! command -v uv >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check uv
          fi
          uv sync --extra dev --frozen
          scripts/run_tests.sh tests/tools/test_startup_latency_regressions.py -q

          new_head=$(git rev-parse HEAD)
          echo "NEW_HEAD=$new_head"
          git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/$branch:$old_head"
          echo 'PUSHED=1'
