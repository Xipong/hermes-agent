name: temp-actions-probe
on:
  push:
    branches: [rebase/actions-probe-20260905]
    paths: [.github/workflows/temp-actions-probe.yml]
permissions:
  contents: write
jobs:
  skills-cache-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed fix to pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/fix_skills_runtime_cache.py /tmp/fix_skills_runtime_cache.py
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream 9dd6634c5635321cf38840cc30e9b51226689128
          git checkout -B __skills_cache 9dd6634c5635321cf38840cc30e9b51226689128
          python /tmp/fix_skills_runtime_cache.py
          git add tools/skills_sync.py tools/skills_sync_optional.py tools/skills_sync_bundled_ops.py tests/tools/test_skills_runtime_cache.py
          git diff --cached --check
          echo "TREE=$(git write-tree)"
          test "$(git write-tree)" = 0635880d4ab12d43547485dc7b48a7623dbaa9e7
      - name: Regression, adjacent sync and guard tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv sync --extra dev --frozen
          .venv/bin/ruff check tools/skills_sync.py tools/skills_sync_optional.py tools/skills_sync_bundled_ops.py tests/tools/test_skills_runtime_cache.py
          scripts/run_tests.sh tests/tools/test_skills_runtime_cache.py tests/tools/test_skills_sync.py tests/tools/test_skills_list_modified_diff.py tests/tools/test_skills_sync_client.py tests/tools/test_skills_guard.py tests/tools/test_skills_hub.py -q
      - name: Publish separate branch only after passing tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=fix/skills-runtime-cache-hash
          git config user.name Xipong
          git config user.email '217837358+Xipong@users.noreply.github.com'
          git commit -m 'fix(skills): exclude generated runtime caches from bundled ownership hashes'
          echo "NEW_HEAD=$(git rev-parse HEAD)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/$branch:"
