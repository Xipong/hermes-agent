name: Corrected port of 76230 over 104299
on:
  push:
    branches: [automation/port-76230-over-104299]
    paths:
      - .github/workflows/port-76230-over-104299.yml
      - scripts/port_76230_over_104299.py
permissions:
  contents: read
concurrency:
  group: port-76230-over-104299
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Export exact surfaces for conflict inspection
        run: |
          set -euo pipefail
          mkdir -p /tmp/port-104299
          git fetch --depth=1 origin a7c0d307d7fea45be40772a9b0663ec096779398 ac53c4fe517ec01d7f20056aeeac107b3559d5a8 4a3a2af360c6d4990f5266c1800d5335bcca6cba
          git fetch --depth=1 https://github.com/NousResearch/hermes-agent.git 028fe2c4c857710ab335a8455f5cbbcc52cbf795
          git archive 028fe2c4c857710ab335a8455f5cbbcc52cbf795 | gzip > /tmp/port-104299/base-104299.tar.gz
          git diff a7c0d307d7fea45be40772a9b0663ec096779398 ac53c4fe517ec01d7f20056aeeac107b3559d5a8 > /tmp/port-104299/old-port.patch
          git archive a7c0d307d7fea45be40772a9b0663ec096779398 tools/async_delegation.py tools/delegate_tool_dispatch.py tools/delegate_tool.py agent/tool_executor.py agent/conversation_loop.py agent/turn_finalizer.py run_agent.py > /tmp/port-104299/old-base-files.tar
          git archive ac53c4fe517ec01d7f20056aeeac107b3559d5a8 agent/delegation_inject.py tests/agent/test_delegation_delivery.py tools/async_delegation.py tools/delegate_tool_dispatch.py tools/delegate_tool.py > /tmp/port-104299/old-port-files.tar
          git archive 4a3a2af360c6d4990f5266c1800d5335bcca6cba agent/delegation_inject.py tests/agent/test_delegation_delivery.py > /tmp/port-104299/oracle-files.tar
          git log -1 --format=fuller 028fe2c4c857710ab335a8455f5cbbcc52cbf795 > /tmp/port-104299/base-commit.txt
          git diff --stat a7c0d307d7fea45be40772a9b0663ec096779398 ac53c4fe517ec01d7f20056aeeac107b3559d5a8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: port-104299-inspection
          path: /tmp/port-104299/
          retention-days: 3
