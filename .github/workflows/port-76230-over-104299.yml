name: Corrected port of 76230 over 104299
on:
  push:
    branches: [automation/port-76230-over-104299]
    paths:
      - .github/workflows/port-76230-over-104299.yml
      - scripts/build_inject_104299.py
      - scripts/unit_tests_104299.txt
      - scripts/adapt_remaining_unit_fixtures_104299.py
      - scripts/prepare_104373_compatible_builder.py
permissions:
  contents: write
concurrency:
  group: port-76230-over-104299
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
      - name: Build only the opt-in delta above merged completion units and recovery
        run: |
          set -euo pipefail
          mkdir -p /tmp/port-104299 /tmp/prior-port
          cp scripts/build_inject_104299.py scripts/unit_tests_104299.txt scripts/adapt_remaining_unit_fixtures_104299.py scripts/prepare_104373_compatible_builder.py /tmp/port-104299/
          python /tmp/port-104299/prepare_104373_compatible_builder.py /tmp/port-104299/build_inject_104299.py
          git fetch --depth=1 origin a7c0d307d7fea45be40772a9b0663ec096779398 ac53c4fe517ec01d7f20056aeeac107b3559d5a8
          git fetch --depth=1 https://github.com/NousResearch/hermes-agent.git c5594ec4b34097cafbe24deb6dfd9ac4b21d411d
          git archive ac53c4fe517ec01d7f20056aeeac107b3559d5a8 tools/async_delegation.py | tar -x -C /tmp/prior-port
          git diff a7c0d307d7fea45be40772a9b0663ec096779398 ac53c4fe517ec01d7f20056aeeac107b3559d5a8 > /tmp/port-104299/old-port.patch
          git switch --detach c5594ec4b34097cafbe24deb6dfd9ac4b21d411d
          python /tmp/port-104299/build_inject_104299.py "$PWD" /tmp/prior-port /tmp/port-104299/old-port.patch
          python /tmp/port-104299/adapt_remaining_unit_fixtures_104299.py "$PWD"
          git add agent/conversation_loop.py agent/delegation_inject.py agent/tool_executor.py agent/turn_finalizer.py run_agent.py tools/async_delegation.py tools/delegate_tool.py tools/delegate_tool_dispatch.py tests/agent/test_delegation_delivery.py website/docs/user-guide/features/delegation.md
          git diff --cached --check
          git diff --cached --stat | tee /tmp/port-104299/diff-stat.txt
          git diff --cached > /tmp/port-104299/corrected-port.patch
          python -m py_compile agent/conversation_loop.py agent/delegation_inject.py agent/tool_executor.py agent/turn_finalizer.py run_agent.py tools/async_delegation.py tools/delegate_tool.py tools/delegate_tool_dispatch.py tests/agent/test_delegation_delivery.py
          test -z "$(git diff --cached --name-only -- .github scripts hermes_state.py gateway cli.py tui_gateway)"
          ! grep -n 'publish_batch_child\|104233' agent/delegation_inject.py tests/agent/test_delegation_delivery.py
      - name: Install locked isolated test environment
        run: uv sync --locked --python 3.11 --extra dev --extra messaging --extra anthropic
      - name: Validate oracle, grouping, recovery, UI ownership and executor regressions
        run: |
          set -o pipefail
          HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh -j 2 --file-timeout 300 \
            tests/agent/test_delegation_delivery.py \
            tests/tools/test_async_delegation.py \
            tests/tools/test_delegate_apiserver_background.py \
            tests/tools/test_process_registry.py \
            tests/tools/test_restored_delegation_ownership.py \
            tests/cli/test_cli_async_delegation_delivery.py \
            tests/gateway/test_completion_delivery.py \
            tests/agent/test_tool_executor_checkpoint_paths.py \
            tests/agent/test_turn_finalizer_cleanup_guard.py \
            tests/agent/test_turn_finalizer_final_response_persistence.py \
            tests/agent/test_turn_finalizer_interrupt_alternation.py \
            tests/agent/test_turn_finalizer_iteration_limit_exit.py \
            tests/tools/test_delegate_batch_validation.py \
            tests/tools/test_delegate_control_actions.py \
            tests/tools/test_delegate_cron_sync_fallback.py \
            tests/tools/test_delegate.py \
            tests/tools/test_delegate_child_cache_ttl.py \
            tests/tui_gateway/test_delegation_session_lifecycle.py \
            --tb=short 2>&1 | tee /tmp/port-104299/tests.txt
      - name: Fresh publication checkout isolated from test subprocesses
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: c5594ec4b34097cafbe24deb6dfd9ac4b21d411d
          path: publish-tree
      - name: Publish independent validated branch without touching the parallel draft
        working-directory: publish-tree
        run: |
          set -euo pipefail
          branch=feat/subagent-inject-over-104299-validated
          expected=c631dc4d2fe0d75625a86d35d8401cf75086bdff
          git remote set-url origin https://github.com/Xipong/hermes-agent.git
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$expected"
          git apply --index /tmp/port-104299/corrected-port.patch
          git diff --cached --check
          git diff --cached > /tmp/port-104299/published.patch
          cmp /tmp/port-104299/corrected-port.patch /tmp/port-104299/published.patch
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git commit -m 'feat(delegation): minimal same-turn inject policy over #104299' -m 'Built above merged #104299 and #104373 (c5594ec4). Preserve completion groups, shared slots and recorded-child recovery; reuse existing unit rows and durable claims. #76230 remains the unchanged reference/test oracle. The parallel incomplete #104426 draft is not overwritten.'
          test "$(git rev-parse HEAD^)" = c5594ec4b34097cafbe24deb6dfd9ac4b21d411d
          git push "--force-with-lease=refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee /tmp/port-104299/published-sha.txt
          git show -s --format=fuller HEAD | tee /tmp/port-104299/published-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: port-104299-validation
          path: /tmp/port-104299/
          retention-days: 3
