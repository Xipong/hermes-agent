name: MCP Desktop WSL validation
on:
  push:
    branches: [work/mcp-desktop-wsl-validation-20260910]
    paths: [.mcp-validation/revision.py]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: input}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: 564aef2946c436500a5e80ee117b66b789b3f99a
          path: source
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install locked runtime and test dependencies
        working-directory: source
        run: uv sync --locked --python 3.11 --extra dev --extra mcp
      - name: Baseline and patched MCP tests
        shell: bash
        working-directory: source
        run: uv run --no-sync python ../input/.mcp-validation/revision.py python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mcp-python-${{ matrix.os }}
          path: source/validation-output/
          retention-days: 5
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: input}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: 564aef2946c436500a5e80ee117b66b789b3f99a
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install workspace dependencies
        working-directory: source
        run: npm ci --ignore-scripts
      - name: Baseline and patched Desktop tests
        working-directory: source
        run: python ../input/.mcp-validation/revision.py desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mcp-desktop
          path: source/validation-output/
          retention-days: 5
  publish:
    needs: [python, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mcp-desktop
          path: /tmp/mcp-validated
      - name: Publish clean product branches without validation harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          base=564aef2946c436500a5e80ee117b66b789b3f99a
          patch=/tmp/mcp-validated/candidate.patch
          desktop=fix/desktop-mcp-config-ownership-20260910
          git switch -c "$desktop" "$base"
          git apply --include=apps/desktop/src/api/config.ts --include=apps/desktop/src/api/config.test.ts --include=apps/desktop/src/app/skills/mcp-tab.tsx --include=apps/desktop/src/app/skills/mcp-tab.test.tsx "$patch"
          git add apps/desktop/src/api/config.ts apps/desktop/src/api/config.test.ts apps/desktop/src/app/skills/mcp-tab.tsx apps/desktop/src/app/skills/mcp-tab.test.tsx
          git diff --cached --check
          git commit -m 'fix(desktop): preserve MCP config deadlines and profile ownership'
          if git show-ref --verify --quiet "refs/remotes/origin/$desktop"; then
            git diff --exit-code "origin/$desktop" HEAD
          else
            git push origin "HEAD:refs/heads/$desktop"
          fi
          git switch -c feat/mcp-wsl-windows-loopback-final-20260910 "$base"
          git apply --exclude=apps/desktop/src/api/config.ts --exclude=apps/desktop/src/api/config.test.ts --exclude=apps/desktop/src/app/skills/mcp-tab.tsx --exclude=apps/desktop/src/app/skills/mcp-tab.test.tsx "$patch"
          git add tools/mcp_windows.py tools/mcp_tool_transport.py tools/mcp_tool_server_run.py tests/tools/test_mcp_windows.py tests/tools/test_mcp_windows_policy.py apps/desktop/src/lib/mcp-probe-cache.ts apps/desktop/src/lib/mcp-probe-cache.test.ts cli-config.yaml.example website/docs/reference/mcp-config-reference.md website/docs/user-guide/features/mcp.md
          git diff --cached --check
          git commit -m 'feat(mcp): reach Windows loopback servers from WSL without LAN exposure'
          git push origin HEAD:refs/heads/feat/mcp-wsl-windows-loopback-final-20260910
