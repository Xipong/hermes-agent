name: History navigation three-PR acceptance
on:
  push:
    branches: [workbench/history-suite-125766]
    paths:
      - workbench/history_suite_125766.py
      - .github/workflows/history-suite-125766.yml
permissions:
  contents: read
concurrency:
  group: history-suite-125766
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_SHA: 48a2db6ac9318c6fa028bf015dbc65e74009f756
      ORIGINAL_SHA: 46d0b7c21f8bb561458379e97f0fc842145b2905
      MAIN_SHA: 2ffa4977baf9874c498453a09447dc399b0fd215
      RAIL_SHA: e993464b1e0312063d2d3c4ef5c2af4d616e601f
      BELOW_SHA: fbfd4f98c70cf7a18d2f053f3d9f32c82024f27f
      HERMES_TEST_WORKERS: '2'
      HERMES_TEST_FILE_RETRIES: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select immutable product inputs
        run: |
          cp workbench/history_suite_125766.py "$RUNNER_TEMP/history_suite_125766.py"
          python3 -m py_compile "$RUNNER_TEMP/history_suite_125766.py"
          git fetch --depth=100 origin "$PRODUCT_SHA" "$ORIGINAL_SHA" "$MAIN_SHA" "$RAIL_SHA" "$BELOW_SHA"
          git checkout --detach "$PRODUCT_SHA"
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic"]'
          test-environment: 'true'
          cache-suffix: issue125766-history
      - name: Verify candidate and disposable integration
        run: '"$HERMES_PYTHON" "$RUNNER_TEMP/history_suite_125766.py"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: history-suite-125766-evidence
          path: ${{ runner.temp }}/history-suite-evidence/
          retention-days: 7
