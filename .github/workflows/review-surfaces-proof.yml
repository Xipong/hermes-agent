name: Review surfaces regression proof
on:
  push:
    branches: [ops/review-surfaces-proof]
permissions:
  contents: read
concurrency:
  group: review-surfaces-proof
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'Xipong/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Capture existing receipt fix
        run: |
          git fetch origin f556836024dbe9a3173ff1a6c87be63dad674fac --depth=2
          git diff f556836024dbe9a3173ff1a6c87be63dad674fac^ f556836024dbe9a3173ff1a6c87be63dad674fac > /tmp/receipts.patch
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-patch
          path: /tmp/receipts.patch
          retention-days: 3
