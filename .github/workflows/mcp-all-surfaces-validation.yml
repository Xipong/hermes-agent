name: MCP legacy namespace regression validation
on:
  push:
    branches: [work/mcp-all-surfaces-validation-20260911]
    paths: [.mcp-expand/recheck.py]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: input}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Xipong/hermes-agent
          ref: 9422ffe3d4bbd98c471aae94da2a832ff53ad226
          path: patch-input
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Xipong/hermes-agent
          ref: 5e2369e70784b037ee62adde850e99926c5bd06e
          path: source
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install locked dependencies
        working-directory: source
        run: uv sync --locked --python 3.11 --extra dev --extra mcp --extra acp
      - name: Prove RED and GREEN across Python MCP boundaries
        shell: bash
        working-directory: source
        run: uv run --no-sync python ../input/.mcp-expand/recheck.py python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-network-${{ matrix.os }}
          path: source/validation-output/
          retention-days: 7
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: input}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Xipong/hermes-agent
          ref: 9422ffe3d4bbd98c471aae94da2a832ff53ad226
          path: patch-input
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Xipong/hermes-agent
          ref: 5e2369e70784b037ee62adde850e99926c5bd06e
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install workspace dependencies
        working-directory: source
        run: npm ci --ignore-scripts
      - name: Prove RED and GREEN across Desktop and dashboard
        working-directory: source
        run: python ../input/.mcp-expand/recheck.py ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-network-ui
          path: source/validation-output/
          retention-days: 7
  publish:
    needs: [python, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Xipong/hermes-agent
          ref: 5e2369e70784b037ee62adde850e99926c5bd06e
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: legacy-network-*, path: /tmp/mcp-regression}
      - name: Replace the noisy fix commit with the exact minimal validated patch
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/mcp-regression/legacy-network-ui/candidate.patch /tmp/mcp-regression/legacy-network-ubuntu-24.04/candidate.patch
          cmp /tmp/mcp-regression/legacy-network-ui/candidate.patch /tmp/mcp-regression/legacy-network-windows-latest/candidate.patch
          git apply /tmp/mcp-regression/legacy-network-ui/candidate.patch
          git diff --check
          git config user.name Xipong
          git config user.email 217837358+Xipong@users.noreply.github.com
          git add -A
          git commit -m 'fix(mcp): keep legacy loopback configs in their original namespace'
          git push --force-with-lease=refs/heads/feat/mcp-wsl-windows-loopback-final-20260910:88e55b0cc8d9a748cbcafd72cb57043b027e0cf1 \
            origin HEAD:refs/heads/feat/mcp-wsl-windows-loopback-final-20260910
