name: Dashboard API/config split validation
on:
  push:
    branches: [work/split-dashboard-api-config-example-20260911]
    paths:
      - .refactor/**
      - .github/workflows/refactor-dashboard-api-config.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: python .refactor/analyze.py
